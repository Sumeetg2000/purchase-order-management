name: e2e

# The end-to-end suite against a fresh compose stack, called by ci.yml and nightly.yml.
# Same public-repository rules as its callers: no secrets, read-only token (ADR-0020).
on:
  workflow_call:
    inputs:
      browsers:
        description: Comma-separated Playwright engines, e.g. chromium or chromium,firefox,webkit.
        required: true
        type: string
      report-name:
        description: Name of the uploaded reports artifact.
        required: true
        type: string
      if-no-files-found:
        description: What the report upload does when reports/ is empty (error or warn).
        required: false
        type: string
        default: error
      timeout-minutes:
        required: false
        type: number
        default: 20

permissions:
  contents: read

jobs:
  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # The disposable e2e project behind its e2e-only TLS edge, as scripts/e2e-local.sh:
    # every engine keeps the Secure cookies, and e2e/support/limits.ts may clear the
    # per-address rate-limit counters of compose project po-e2e before each spec file.
    env:
      COMPOSE_PROJECT_NAME: po-e2e
      COMPOSE_FILE: docker-compose.yml:deploy/e2e/compose.tls.yml
      E2E_TLS_PORT: '8443'
      APP_ORIGIN: https://localhost:8443
      E2E_BASE_URL: https://localhost:8443
      E2E_BROWSERS: ${{ inputs.browsers }}
    steps:
      # The start-time budget is measured from a clean checkout, so the clock starts before the build.
      - name: Record start time
        run: echo "SMOKE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env from .env.example with random throwaway secrets: no repository secrets needed.
      - name: Write .env
        run: scripts/ci-env.sh
      - name: Make the e2e TLS certificate
        run: scripts/e2e-tls-cert.sh
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: scripts/smoke.sh
      - uses: ./.github/actions/setup
      - name: Install the browsers
        run: |
          IFS=, read -ra engines <<<"$E2E_BROWSERS"
          npx playwright install --with-deps "${engines[@]}"
      - name: End-to-end tests
        run: npm run e2e
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.report-name }}
          path: reports/
          if-no-files-found: ${{ inputs.if-no-files-found }}
          retention-days: 14
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
