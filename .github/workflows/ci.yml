name: CI

# Public repository: runs only on pull requests to main and pushes to main.
# Never pull_request_target, never secrets in a PR job, read-only token (ADR-0020).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: npm run lint
      - name: Requirement-ID ban
        run: npm run check:ids
      - run: npm run format:check
      - run: npm run typecheck
      - name: Script tests (compose file, check scripts)
        run: npm run test:scripts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-scripts
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: commitlint (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Unit and integration tests; integration tests start PostgreSQL 17.11 through
      # Testcontainers on the runner's Docker (research R19).
      - run: npm test -w @po/backend
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-backend
          path: reports/
          if-no-files-found: error
          retention-days: 14

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The breaking-change check is contract-breaking.yml, which also reruns on label and
      # description changes without rerunning this whole workflow.
      # The generator's own tests. The web client's tests run in the web job.
      - run: npm test -w @po/contracts
      - name: Regenerate the OpenAPI document and the web client types
        run: npm run contract:generate && npm run contract:types
      - name: Drift check
        run: |
          drift="$(git status --porcelain -- packages/contracts/openapi frontend/src/api)"
          if [[ -n "$drift" ]]; then
            echo "$drift"
            git diff -- packages/contracts/openapi frontend/src/api
            echo "::error::Generated contract files differ from the committed ones. Run npm run contract:generate && npm run contract:types and commit the result."
            exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-contract
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # Unit, component and axe tests.
      - run: npm test -w @po/frontend
      - run: npm run build -w @po/frontend
      - name: Bundle budget
        run: npm run check:bundle
      - name: No development-only demo code in the build
        run: |
          if grep -rlE '__demo|Component demo' frontend/dist; then
            echo "::error::The production build contains the development-only demo route."
            exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-web
          path: reports/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: false
      # Reads package-lock.json; nothing is installed.
      - run: npm audit --audit-level=high

  # Playwright against a fresh compose stack: Chromium on pull requests; Chromium,
  # Firefox and WebKit on pushes to main (and nightly, nightly.yml).
  e2e:
    name: e2e
    uses: ./.github/workflows/e2e.yml
    with:
      browsers: ${{ github.event_name == 'push' && 'chromium,firefox,webkit' || 'chromium' }}
      report-name: reports-e2e

  # Query plans at the ADR-0012 sizes (slice 2 research R11): too slow for the default run.
  # On a pull request it runs only when a change could move a plan; otherwise plans-scope
  # says why in its summary and plans shows as Skipped, never as a missing check.
  plans-scope:
    name: plans-scope
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the plans run
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          paths=(backend packages/contracts docs/query-plans package-lock.json .github/workflows/ci.yml
                 .github/workflows/plans.yml .github/actions/setup)
          if [[ "$EVENT" != pull_request ]]; then
            reason="push to main: the plans always run"
            run=true
          else
            changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA" -- "${paths[@]}")"
            if [[ -n "$changed" ]]; then
              reason="changes that can move a plan: $(echo "$changed" | head -5 | paste -sd ' ')"
              run=true
            else
              reason="no change under ${paths[*]}: the plans are skipped"
              run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "::notice title=plans::$reason"
          echo "**plans**: $reason" >> "$GITHUB_STEP_SUMMARY"

  plans:
    name: plans
    needs: [plans-scope]
    if: needs.plans-scope.outputs.run == 'true'
    uses: ./.github/workflows/plans.yml
    with:
      report-name: reports-plans

  traceability:
    name: traceability
    needs: [static, api, contract, web, e2e, plans]
    # Runs when the plans are skipped (no change could move a plan), never after a failure.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: false
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      # Plain Node script: nothing to install.
      - run: npm run check:traceability
      - name: Upload the requirement → tests listing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability
          path: reports/traceability.json
          if-no-files-found: warn
          retention-days: 30

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR commit range and the full history both need complete git history.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose
          --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: gitleaks (full history)
        if: github.event_name == 'push'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose
