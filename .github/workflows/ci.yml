name: CI

# Public repository: runs only on pull requests to main and pushes to main.
# Never pull_request_target, never secrets in a PR job, read-only token (ADR-0020).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color
      - run: npm run lint
      - name: Requirement-ID ban
        run: npm run check:ids
      - run: npm run format:check
      - run: npm run typecheck
      - name: Script tests (compose file, check scripts)
        run: npm run test:scripts
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-scripts
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: commitlint (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: npx commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose

  api:
    name: api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit and integration tests; integration tests start PostgreSQL 17.11 through
      # Testcontainers on the runner's Docker (research R19).
      - run: npm test -w @po/backend
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-backend
          path: reports/
          if-no-files-found: error
          retention-days: 14

  contract:
    name: contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The breaking-change check is contract-breaking.yml, which also reruns on label and
      # description changes without rerunning this whole workflow.
      # The generator's own tests. The web client's tests run in the web job.
      - run: npm test -w @po/contracts
      - name: Regenerate the OpenAPI document and the web client types
        run: npm run contract:generate && npm run contract:types
      - name: Drift check
        run: |
          drift="$(git status --porcelain -- packages/contracts/openapi frontend/src/api)"
          if [[ -n "$drift" ]]; then
            echo "$drift"
            git diff -- packages/contracts/openapi frontend/src/api
            echo "::error::Generated contract files differ from the committed ones. Run npm run contract:generate && npm run contract:types and commit the result."
            exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-contract
          path: reports/*.json
          if-no-files-found: error
          retention-days: 14

  web:
    name: web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Unit, component and axe tests.
      - run: npm test -w @po/frontend
      - run: npm run build -w @po/frontend
      - name: Bundle budget
        run: npm run check:bundle
      - name: No development-only demo code in the build
        run: |
          if grep -rlE '__demo|Component demo' frontend/dist; then
            echo "::error::The production build contains the development-only demo route."
            exit 1
          fi
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-web
          path: reports/
          if-no-files-found: error
          retention-days: 14

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Reads package-lock.json; nothing is installed.
      - run: npm audit --audit-level=high

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # SC-001 measures from a clean checkout, so the clock starts before the build.
      - name: Record start time
        run: echo "SMOKE_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env from .env.example with random throwaway secrets: no repository secrets needed.
      - name: Write .env
        run: scripts/ci-env.sh
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: scripts/smoke.sh
      # Playwright against the running stack (FR-041): Chromium on pull requests; Chromium,
      # Firefox and WebKit on pushes to main (and nightly, nightly.yml).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browsers
        env:
          E2E_BROWSERS: ${{ github.event_name == 'push' && 'chromium,firefox,webkit' || 'chromium' }}
        run: |
          IFS=, read -ra engines <<<"$E2E_BROWSERS"
          npx playwright install --with-deps "${engines[@]}"
      - name: End-to-end tests
        env:
          E2E_BROWSERS: ${{ github.event_name == 'push' && 'chromium,firefox,webkit' || 'chromium' }}
        run: npm run e2e
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-e2e
          path: reports/
          if-no-files-found: error
          retention-days: 14
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v

  traceability:
    name: traceability
    needs: [static, api, contract, web, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Download test reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: reports-*
          path: reports
          merge-multiple: true
      # Plain Node script: nothing to install.
      - run: npm run check:traceability
      - name: Upload the requirement → tests listing
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: traceability
          path: reports/traceability.json
          if-no-files-found: warn
          retention-days: 30

  secrets:
    name: secrets
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR commit range and the full history both need complete git history.
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (pull request commits)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose
          --log-opts="$BASE_SHA..$HEAD_SHA"
      - name: gitleaks (full history)
        if: github.event_name == 'push'
        run: >-
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/repo"
          ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          git /repo --config /repo/.gitleaks.toml --redact --verbose
