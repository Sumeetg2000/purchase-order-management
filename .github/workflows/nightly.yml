name: Nightly

# The end-to-end suite on Chromium, Firefox and WebKit against a fresh compose stack
# (browser support, research R22). A failure here is treated like a failed check on main.
# Same public-repository rules as ci.yml: no pull_request_target, no secrets, read-only
# token (ADR-0020).
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (all engines)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # The disposable e2e project behind its e2e-only TLS edge, as scripts/e2e-local.sh:
    # every engine keeps the Secure cookies, and e2e/support/limits.ts may clear the
    # per-address rate-limit counters of compose project po-e2e before each spec file.
    env:
      COMPOSE_PROJECT_NAME: po-e2e
      COMPOSE_FILE: docker-compose.yml:deploy/e2e/compose.tls.yml
      E2E_TLS_PORT: '8443'
      APP_ORIGIN: https://localhost:8443
      E2E_BASE_URL: https://localhost:8443
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # .env from .env.example with random throwaway secrets: no repository secrets needed.
      - name: Write .env
        run: scripts/ci-env.sh
      - name: Make the e2e TLS certificate
        run: scripts/e2e-tls-cert.sh
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Smoke test
        run: scripts/smoke.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install the browsers
        run: npx playwright install --with-deps chromium firefox webkit
      - name: End-to-end tests
        env:
          E2E_BROWSERS: chromium,firefox,webkit
        run: npm run e2e
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reports-nightly
          path: reports/
          if-no-files-found: warn
          retention-days: 14
      - name: Compose logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop the stack
        if: always()
        run: docker compose down -v
