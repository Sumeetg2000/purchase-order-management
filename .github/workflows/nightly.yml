name: Nightly

# The end-to-end suite on Chromium, Firefox and WebKit against a fresh compose stack
# (browser support, research R22), and the query plans at the ADR-0012 sizes (slice 2
# research R11). A failure here is treated like a failed check on main.
# Same public-repository rules as ci.yml: no pull_request_target, no secrets, read-only
# token (ADR-0020).
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (all engines)
    uses: ./.github/workflows/e2e.yml
    with:
      browsers: chromium,firefox,webkit
      report-name: reports-nightly
      if-no-files-found: warn
      timeout-minutes: 30

  plans:
    name: plans
    uses: ./.github/workflows/plans.yml
    with:
      report-name: plans-report
