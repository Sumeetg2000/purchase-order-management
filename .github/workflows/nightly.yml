name: Nightly

# The end-to-end suite on Chromium, Firefox and WebKit against a fresh compose stack
# (browser support, research R22), and the query plans at the ADR-0012 sizes (slice 2
# research R11). A failure here is treated like a failed check on main.
# Same public-repository rules as ci.yml: no pull_request_target, no secrets, read-only
# token (ADR-0020).
on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  e2e:
    name: e2e (all engines)
    uses: ./.github/workflows/e2e.yml
    with:
      browsers: chromium,firefox,webkit
      report-name: reports-nightly
      if-no-files-found: warn
      # Three browsers: the same budget as main's (ci.yml).
      timeout-minutes: 35

  plans:
    name: plans
    uses: ./.github/workflows/plans.yml
    with:
      report-name: plans-report

  # The brief's §8 load test (ADR-0012, amended 2026-11-26): 10,000 orders across 200
  # vendors through the API on an isolated po-load stack; fails on any 5xx or timeout, any
  # reconciliation row or an unexplained unused index. Nightly and on demand, never on pull
  # requests. Its record and plan are uploaded, not committed: the committed record is the
  # one recorded run in docs/perf/load-run.md.
  load:
    name: load
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      # The report's SQL is rendered from the backend's own repository (Prisma client and
      # the built contracts), as the plans job prepares them.
      - run: npm run preplans:orders -w @po/backend
      - run: npm run load
      - name: Upload the load record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: load-report
          path: |
            reports/load/
            docs/perf/load-run.md
            docs/query-plans/load/
          if-no-files-found: warn
