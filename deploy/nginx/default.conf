# The same-origin edge (ADR-0017): serves the React build and proxies /api/ to the API.
# The app's CSP and security headers are deploy/security-headers.mjs's, repeated in each
# location that serves the app (an add_header in a location replaces the server's); a
# script test keeps them equal. /api/ adds none: the API sends its own.

# The API path taken from the raw request URI, so encoded characters such as %2F reach
# the API exactly as the client sent them ($uri is already decoded, and a regex capture
# used in proxy_pass would be escaped a second time).
map $request_uri $api_path {
    "~^/api(?<rest>/.*)$" $rest;
    default "";
}

# Access log without secrets. Links carry one-time tokens in the fragment, which browsers
# never send, but a legacy or hand-made ?token= link (or a Referer copied from one) must
# not log the value either: any query with a key ending in "token" (any case) is replaced
# whole by [redacted]. Otherwise the line matches nginx's default "main" format.
map $request_uri $loggable_request_uri {
    "~*^(?<path>[^?]*)\?.*token=" "${path}?[redacted]";
    default $request_uri;
}

map $http_referer $loggable_referer {
    "" "-";
    "~*^(?<page>[^?]*)\?.*token=" "${page}?[redacted]";
    default $http_referer;
}

log_format redacted '$remote_addr - $remote_user [$time_local] '
                    '"$request_method $loggable_request_uri $server_protocol" '
                    '$status $body_bytes_sent "$loggable_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    # The image links this path to stdout; the server-level directive replaces the
    # http-level "main" log, so only the redacted format is written.
    access_log /var/log/nginx/access.log redacted;

    # Larger than the API's 1 MB body limit, so the API answers oversized bodies with its
    # own problem document.
    client_max_body_size 2m;

    # Docker's embedded DNS, re-resolved so a restarted api container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Internal metrics are never served at the edge (contracts/metrics.md).
    location = /metrics {
        return 404;
    }

    # Errors the edge raises itself are problem+json too, with the registry's code, title
    # and status (packages/contracts/src/errors.ts). No correlationId: the API never saw
    # the request. The API's own error responses pass through untouched.
    error_page 413 @payload_too_large;
    error_page 502 503 504 =503 @service_unavailable;

    location @payload_too_large {
        default_type application/problem+json;
        return 413 '{"type":"about:blank","title":"Payload too large","status":413,"code":"PAYLOAD_TOO_LARGE"}';
    }

    location @service_unavailable {
        default_type application/problem+json;
        add_header Retry-After 5 always;
        return 503 '{"type":"about:blank","title":"Service unavailable","status":503,"code":"SERVICE_UNAVAILABLE"}';
    }

    location /api/ {
        if ($api_path = "") {
            return 404;
        }
        proxy_pass http://api:3000$api_path;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # The only proxy: replace any client-supplied value rather than appending to it.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        try_files $uri /index.html;
    }
}
