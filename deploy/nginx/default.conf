# The same-origin edge (ADR-0017): serves the React build and proxies /api/ to the API.
# Security headers and the CSP are added with deploy/security-headers.mjs (T096).

server {
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;

    # Larger than the API's 1 MB body limit, so the API answers oversized bodies with its
    # own problem document.
    client_max_body_size 2m;

    # Docker's embedded DNS, re-resolved so a restarted api container is found again.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Internal metrics are never served at the edge (contracts/metrics.md).
    location = /metrics {
        return 404;
    }

    location /api/ {
        set $api_upstream http://api:3000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build assets never change.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Client-side routes fall back to the app shell, which is never cached.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
