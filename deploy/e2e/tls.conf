# End-to-end runs only (deploy/e2e/compose.tls.yml): TLS in front of the web edge, with a
# throwaway certificate made at run time (scripts/e2e-tls-cert.sh). Everything else is
# web's: headers, limits and errors pass through untouched. Production nginx is
# deploy/nginx/default.conf, which this file never replaces.
server {
    listen 8443 ssl;
    server_name localhost;
    server_tokens off;

    ssl_certificate /etc/nginx/tls/cert.pem;
    ssl_certificate_key /etc/nginx/tls/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # The body limit is web's (deploy/nginx/default.conf), not this proxy's.
    client_max_body_size 0;

    location / {
        proxy_pass http://web:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
    }
}
